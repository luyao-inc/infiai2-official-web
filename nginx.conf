server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Match the original browser request, not Nginx's internal directory index redirect.
    if ($request_uri ~ "^/(en/)?index\.html(?:\?|$)") { return 301 /$1$is_args$args; }
    if ($request_uri ~ "^/((?:en/)?(?:about|terms|privacy))/index\.html(?:\?|$)") { return 301 /$1/$is_args$args; }

    if ($request_uri ~ "^/((?:guides|compare)/[a-z0-9-]+|pricing|security|updates)/index\.html(?:\?|$)") { return 301 /$1/$is_args$args; }

    # GEO：机器可读资源直连磁盘文件，避免 try_files 回退到 SPA 的边界情况。
    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        try_files /robots.txt =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        charset utf-8;
        try_files /sitemap.xml =404;
    }
    location = /feed.xml {
        default_type application/rss+xml;
        charset utf-8;
        try_files /feed.xml =404;
    }
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        try_files /llms.txt =404;
    }
    location = /llms-full.txt {
        default_type text/plain;
        charset utf-8;
        try_files /llms-full.txt =404;
    }
    location = /humans.txt {
        default_type text/plain;
        charset utf-8;
        try_files /humans.txt =404;
    }
    location = /.well-known/ai.txt {
        default_type text/plain;
        charset utf-8;
        try_files /.well-known/ai.txt =404;
    }

    # Stable Widget entrypoints must revalidate so every host can discover the
    # latest hashed UI assets after a release. The hashed CSS/JS remain cacheable.
    location = /widget/v1/loader.js {
        add_header Cache-Control "no-cache" always;
        try_files /widget/v1/loader.js =404;
    }
    location = /widget/embed/ {
        add_header Cache-Control "no-cache" always;
        try_files /widget/embed/index.html =404;
    }
    location = /widget/embed/index.html {
        add_header Cache-Control "no-cache" always;
        try_files /widget/embed/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/xml
        application/xml
        text/plain
        application/rss+xml;
}
